[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peryl_agents"
version = "0.1.0"
description = "Peryl functions to run AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "peryl_db",
    "psycopg>=3.3.6",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
peryl_db = { path = "../peryl_db", editable = true }

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false
